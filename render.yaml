services:
  # =====================================
  # Main platform: React SPA + Express API
  # =====================================
  - type: web
    name: agrogrowth-platform
    env: node
    repo: https://github.com/Arfaoui859/AgroDev
    rootDir: .
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: node build/server/node-build.mjs
    healthCheckPath: /api/health
    plan: starter
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; the server reads it (defaults to 8080 locally).
      - key: SOIL_ANALYSIS_URL
        fromService: { type: web, name: agrogrowth-soil-analysis, property: hostport }
      - key: CROP_RECOMMENDATION_URL
        fromService: { type: web, name: agrogrowth-crop-recommendation, property: hostport }
      - key: IMAGE_DIAGNOSIS_URL
        fromService: { type: web, name: agrogrowth-image-diagnosis, property: hostport }
      - key: MARKET_FORECAST_URL
        fromService: { type: web, name: agrogrowth-market-prediction, property: hostport }
      - key: SMART_ASSISTANT_URL
        fromService: { type: web, name: agrogrowth-intelligent-agent, property: hostport }
      - key: SMART_MARKETPLACE_URL
        fromService: { type: web, name: agrogrowth-weather-yield, property: hostport }
      - key: PEST_CONTROL_URL
        fromService: { type: web, name: agrogrowth-pest-control, property: hostport }
      - key: IRRIGATION_OPTIMIZATION_URL
        fromService: { type: web, name: agrogrowth-irrigation-optimization, property: hostport }
      - key: DATABASE_URL
        fromDatabase:
          name: agrogrowth-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agrogrowth-redis
          property: connectionString

  # Soil Analysis Service
  - type: web
    name: agrogrowth-soil-analysis
    env: python
    repo: https://github.com/Arfaoui859/AgroDev
    rootDir: ./agrogrowth-ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn soil_analysis.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: SERVICE_PORT
        value: 8001
      - key: MODEL_PATH
        value: /app/models
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        fromDatabase:
          name: agrogrowth-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agrogrowth-redis
          property: connectionString

  # Crop Recommendation Service
  - type: web
    name: agrogrowth-crop-recommendation
    env: python
    repo: https://github.com/Arfaoui859/AgroDev
    rootDir: ./agrogrowth-ai
