    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: SERVICE_PORT
        value: 8002
      - key: MODEL_PATH
        value: /app/models
      - key: PYTHONPATH
        value: /opt/render/project/src

