# AgroGrowth - Render Blueprint (corrected)
# Secrets use `sync: false`: Render asks for them in the dashboard, they are never stored in git.
# Database = Supabase (existing project), NOT a new Render Postgres.

services:
  # ============================================================
  # Main platform: React SPA + Express API (public)
  # ============================================================
  - type: web
    name: agrogrowth-platform
    runtime: node
    branch: feat/soil-analysis-professional-report   # autonomous agent + notification persistence branch
    region: frankfurt
    plan: starter
    # --include=dev: NODE_ENV=production would otherwise skip devDependencies needed by the build
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: node build/server/node-build.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"                # verify against package.json "engines"

      # --- Supabase (server) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # --- Supabase (client, baked at build time) ---
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

      # --- Database (Supabase pooler; see .env.example) ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- AI provider ---
      - key: GEMINI_API_KEY
        sync: false

      - key: SESSION_SECRET
        generateValue: true
      - key: AGRO_AGENT_MONITOR_TOKEN
        sync: false
      - key: AGRO_AGENT_SOIL_REVIEW_DAYS
        value: "180"

      # --- Internal Python services (private network, value = host:port) ---
      - key: SOIL_ANALYSIS_URL
        fromService:
          type: pserv
          name: agrogrowth-soil-analysis
          property: hostport
      - key: CROP_RECOMMENDATION_URL
        fromService:
          type: pserv
          name: agrogrowth-crop-recommendation
          property: hostport
      - key: IMAGE_DIAGNOSIS_URL
        fromService:
          type: pserv
          name: agrogrowth-image-diagnosis
          property: hostport
      - key: MARKET_FORECAST_URL
        fromService:
          type: pserv
          name: agrogrowth-market-prediction
          property: hostport
      - key: SMART_ASSISTANT_URL
        fromService:
          type: pserv
          name: agrogrowth-intelligent-agent
          property: hostport
      # The server reads either WEATHER_YIELD_INTELLIGENCE_URL or its legacy
      # alias SMART_MARKETPLACE_URL (see server/lib/env.ts firstEnv); set both so
      # neither name is ever the reason a running service looks unconfigured.
      - key: WEATHER_YIELD_INTELLIGENCE_URL
        fromService:
          type: pserv
          name: agrogrowth-weather-yield
          property: hostport
      - key: SMART_MARKETPLACE_URL
        fromService:
          type: pserv
          name: agrogrowth-weather-yield
          property: hostport
      - key: PEST_CONTROL_URL
        fromService:
          type: pserv
          name: agrogrowth-pest-control
          property: hostport
      - key: IRRIGATION_OPTIMIZATION_URL
        fromService:
          type: pserv
          name: agrogrowth-irrigation-optimization
          property: hostport

  # ============================================================
  # Python AI services = PRIVATE services (not exposed to internet)
  # Private services do not support healthCheckPath.
  # ============================================================
  - type: pserv
    name: agrogrowth-soil-analysis
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: agrogrowth-ai
    # Keep runtime sklearn/joblib versions aligned with the committed production artifacts.
    buildCommand: pip install -r soil_analysis/requirements-ml.txt
    startCommand: python -m uvicorn soil_analysis.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: pserv
    name: agrogrowth-crop-recommendation
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: agrogrowth-ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn crop_recommendation.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: pserv
    name: agrogrowth-image-diagnosis
    runtime: python
    region: frankfurt
    plan: standard            # TensorFlow/vision does not fit in 512 MB (starter)
    rootDir: agrogrowth-ai
    # Install the ONNX CPU runtime and this service's bounded dependencies only;
    # the repository-wide requirements also pull TensorFlow/PyTorch training stacks.
    buildCommand: pip install -r image_diagnosis/requirements.txt
    startCommand: python -m uvicorn image_diagnosis.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: pserv
    name: agrogrowth-market-prediction
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: agrogrowth-ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn market_prediction.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: pserv
    name: agrogrowth-intelligent-agent
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: agrogrowth-ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn intelligent_agent.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false

  - type: pserv
    name: agrogrowth-weather-yield
    runtime: python
    region: frankfurt
    plan: standard            # trains sklearn models on first request (~100 s, memory heavy)
    rootDir: agrogrowth-ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn weather_yield_intelligence.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: pserv
    name: agrogrowth-pest-control
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: agrogrowth-ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn pest_control.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: pserv
    name: agrogrowth-irrigation-optimization
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: agrogrowth-ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn irrigation_optimization.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
