name: ONAGRI agricultural catalog review

on:
  workflow_dispatch:
  schedule:
    # Refresh review candidates monthly; never publish catalog records automatically.
    - cron: "30 5 1 * *"

permissions:
  contents: read

concurrency:
  group: onagri-catalog-review
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook reader
        run: python -m pip install --quiet openpyxl
      - name: Discover ONAGRI workbooks and prepare unapproved candidates
        run: python scripts/market-data/prepare_onagri_catalog_review.py --output onagri-catalog-review.json
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: onagri-catalog-review
          path: onagri-catalog-review.json
          retention-days: 30
