name: AgroGrowth Autonomous Farm Monitor

on:
  schedule:
    # GitHub Actions schedules are best-effort; this is not a hard real-time SLA.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agrogrowth-autonomous-farm-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate monitor configuration
        shell: bash
        env:
          MONITOR_URL: ${{ secrets.AGRO_AGENT_MONITOR_URL }}
          MONITOR_TOKEN: ${{ secrets.AGRO_AGENT_MONITOR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MONITOR_URL" || -z "$MONITOR_TOKEN" ]]; then
            echo "::error::Configure AGRO_AGENT_MONITOR_URL and AGRO_AGENT_MONITOR_TOKEN in GitHub Actions secrets."
            exit 1
          fi

      - name: Run evidence-based farm monitoring
        shell: bash
        env:
          MONITOR_URL: ${{ secrets.AGRO_AGENT_MONITOR_URL }}
          MONITOR_TOKEN: ${{ secrets.AGRO_AGENT_MONITOR_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${MONITOR_URL%/}"
          curl --fail-with-body --silent --show-error             --retry 2 --retry-delay 10 --connect-timeout 20 --max-time 240             -X POST "${BASE_URL}/api/internal/autonomous-agent/run"             -H "Authorization: Bearer ${MONITOR_TOKEN}"             -H "Content-Type: application/json"             -d '{}'
