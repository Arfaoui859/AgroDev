name: 🔄 Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "18"
  PYTHON_VERSION: "3.9"

jobs:
  # =====================================
  # CODE QUALITY AND LINTING
  # =====================================
  lint-and-format:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🔍 Lint TypeScript/JavaScript
        run: npm run lint

      - name: 🎨 Check code formatting
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

      - name: 📊 TypeScript type checking
        run: npx tsc --noEmit

  # =====================================
  # BACKEND TESTING
  # =====================================
  backend-tests:
    name: 🚀 Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test
        env:
          NODE_ENV: test

      - name: 🔗 Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test

      - name: 📊 Generate coverage report
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: backend
          name: backend-coverage

  # =====================================
  # AI SERVICES TESTING
  # =====================================
  ai-services-tests:
    name: 🤖 AI Services Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📋 Install Python dependencies
        run: |
          cd agrogrowth-ai
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run AI services tests
        run: |
          cd agrogrowth-ai
          python -m pytest tests/ -v --cov=. --cov-report=xml

      - name: 📈 Upload AI coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./agrogrowth-ai/coverage.xml
          flags: ai-services
          name: ai-services-coverage

  # =====================================
  # FRONTEND BUILDING AND TESTING
  # =====================================
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # =====================================
  # E2E TESTING WITH CYPRESS
  # =====================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: dist/

      - name: 🚀 Start development server
        run: |
          npm run server:dev &
          npm run dev &
          sleep 30 # Wait for servers to start
        env:
          NODE_ENV: test

      - name: 🎭 Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: "http://localhost:5173"
          wait-on-timeout: 120
          browser: chrome
          record: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Upload Cypress screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: 📹 Upload Cypress videos
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos

  # =====================================
  # SECURITY SCANNING
  # =====================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🔍 Run npm audit
        run: npm audit --audit-level=high

      - name: 🛡️ Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: 📊 Upload Snyk results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif

  # =====================================
  # DOCKER BUILD TESTING
  # =====================================
  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agrogrowth:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================
  # PERFORMANCE TESTING
  # =====================================
  performance-test:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: dist/

      - name: 🚀 Start servers for testing
        run: |
          npm run server:dev &
          npm run preview &
          sleep 30
        env:
          NODE_ENV: production

      - name: ⚡ Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

  # =====================================
  # DEPLOYMENT READINESS CHECK
  # =====================================
  deployment-check:
    name: 🚀 Deployment Readiness
    runs-on: ubuntu-latest
    needs: [lint-and-format, backend-tests, frontend-build, ai-services-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ All checks passed
        run: echo "🎉 All CI checks passed! Ready for deployment."

      - name: 📊 Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code quality checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AI services tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 Ready for deployment to production" >> $GITHUB_STEP_SUMMARY

      - name: 🔔 Slack notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: "#deployments"
          text: "🎉 AgroGrowth CI passed! Ready for deployment."
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
