name: 🔄 Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # =====================================
  # CODE QUALITY: types + lint
  # =====================================
  code-quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 📊 TypeScript type checking
        run: npx tsc --noEmit

      - name: 🔍 Lint
        run: npm run lint

  # =====================================
  # TESTS: unit + integration
  # =====================================
  tests:
    name: 🧪 Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🧪 Run test suite
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: 📈 Upload coverage
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # =====================================
  # FRONTEND + SERVER BUILD
  # =====================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build client + server
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Smoke test production server
        run: |
          node dist/server/node-build.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/api/ping
          curl -sf -o /dev/null http://localhost:8080/
          kill $SERVER_PID
        env:
          NODE_ENV: production
          PORT: 8080

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # =====================================
  # AI MICROSERVICES: syntax + import check
  # =====================================
  ai-services:
    name: 🤖 AI Services
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🧹 Byte-compile all AI services
        run: python -m compileall -q agrogrowth-ai

      - name: 🧪 Bootstrap regression tests (launch target / import / ports)
        run: |
          python -m pip install --quiet pytest
          python -m pytest agrogrowth-ai/tests -q

  # =====================================
  # DOCKER BUILD (production target)
  # =====================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: agrogrowth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================
  # SECURITY SCAN
  # =====================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔍 npm audit (report high severity)
        run: npm audit --audit-level=high || true

  # =====================================
  # DEPLOYMENT READINESS GATE
  # =====================================
  deployment-check:
    name: 🚀 Deployment Readiness
    runs-on: ubuntu-latest
    needs: [code-quality, tests, build, ai-services, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: ✅ All checks passed
        run: echo "🎉 All CI checks passed. Ready for deployment."
