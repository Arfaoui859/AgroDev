name: 🔄 Continuous Integration

on:
  # Validate every branch, not just main/develop. The default branch of this
  # repository is not `main`, so restricting the trigger meant feature branches
  # were never tested.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Keep only the newest validation run for a branch. A long remediation
# sequence can otherwise queue dozens of obsolete runs and delay the final SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # =====================================
  # CODE QUALITY: types + lint
  # =====================================
  code-quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 📊 TypeScript type checking
        run: npx tsc --noEmit

      - name: 🔍 Lint
        run: npm run lint

  # =====================================
  # TESTS: unit + integration
  # =====================================
  tests:
    name: 🧪 Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🧪 Run test suite
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: 📈 Upload coverage
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # =====================================
  # FRONTEND + SERVER BUILD
  # =====================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build client + server
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Smoke test production server
        run: |
          node build/server/node-build.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/api/ping
          curl -sf -o /dev/null http://localhost:8080/
          kill $SERVER_PID
        env:
          NODE_ENV: production
          PORT: 8080

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # =====================================
  # AI MICROSERVICES: syntax + import check
  # =====================================
  ai-services:
    name: 🤖 AI Services
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🧹 Byte-compile all AI services
        run: python -m compileall -q agrogrowth-ai

      - name: 🧪 Bootstrap regression tests (launch target / import / ports)
        run: |
          # The tests import the real service modules, which need fastapi,
          # pydantic, numpy, sklearn, pandas, Pillow and opencv. The heavy ML
          # wheels in requirements.txt (tensorflow/torch) are intentionally not
          # installed: inference falls back to the heuristic engine without them.
          python -m pip install --quiet -r agrogrowth-ai/requirements-test.txt
          python -m pytest agrogrowth-ai/tests -q

  # =====================================
  # DATABASE: schema + RLS enforcement
  # =====================================
  database-rls:
    name: 🗄️ Database RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrogrowth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Prepare PostgreSQL client and SQL fixtures
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          # Use the psql client already shipped in the PostGIS service container.
          # This avoids a slow apt-get install on the GitHub runner.
          docker cp database/. "$POSTGRES_CONTAINER_ID:/tmp/agrogrowth-database/"
          docker cp tests/db/. "$POSTGRES_CONTAINER_ID:/tmp/agrogrowth-tests-db/"
          docker exec "$POSTGRES_CONTAINER_ID" psql --version

      - name: 🧱 Apply schema + RLS hardening
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_cmd() { docker exec -i "$POSTGRES_CONTAINER_ID" psql -U postgres -d agrogrowth -v ON_ERROR_STOP=1 "$@"; }
          # local-rls-shim.sql provides the Supabase objects (auth.uid(), anon /
          # authenticated roles) that a plain Postgres container lacks.
          psql_cmd -f /tmp/agrogrowth-database/local-rls-shim.sql
          psql_cmd -f /tmp/agrogrowth-database/cloud-setup.sql
          psql_cmd -f /tmp/agrogrowth-database/market-prices-compatibility.sql
          psql_cmd -f /tmp/agrogrowth-database/rls-hardening.sql
          psql_cmd -f /tmp/agrogrowth-database/admin-user-management.sql
          psql_cmd -f /tmp/agrogrowth-database/effectiveness-reports.sql

      - name: 🧪 Verify market_prices crop key compatibility
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_cmd() { docker exec -i "$POSTGRES_CONTAINER_ID" psql -U postgres -d agrogrowth -v ON_ERROR_STOP=1 "$@"; }
          psql_cmd -f /tmp/agrogrowth-database/market-prices-compatibility.sql
          psql_cmd -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'market_prices' AND column_name = 'crop_id') THEN RAISE EXCEPTION 'market_prices.crop_id is missing'; END IF; IF to_regclass('public.idx_market_prices_crop_id_price_date') IS NULL THEN RAISE EXCEPTION 'market price crop/date index is missing'; END IF; END \$\$"

      - name: 🔁 Re-apply hardening (must be idempotent)
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_cmd() { docker exec -i "$POSTGRES_CONTAINER_ID" psql -U postgres -d agrogrowth -v ON_ERROR_STOP=1 "$@"; }
          psql_cmd -f /tmp/agrogrowth-database/rls-hardening.sql

      - name: 🧪 Verify legacy weather_data RLS compatibility
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_cmd() { docker exec -i "$POSTGRES_CONTAINER_ID" psql -U postgres -d agrogrowth -v ON_ERROR_STOP=1 "$@"; }
          psql_cmd -c "CREATE TABLE public.weather_data (id uuid PRIMARY KEY, farm_id uuid NOT NULL)"
          psql_cmd -f /tmp/agrogrowth-database/rls-hardening.sql
          psql_cmd -c "DO \$\$ BEGIN IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.weather_data'::regclass) THEN RAISE EXCEPTION 'weather_data RLS is disabled'; END IF; IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'weather_data' AND policyname = 'Owners manage own weather_data') THEN RAISE EXCEPTION 'owner policy missing'; END IF; IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'weather_data' AND policyname = 'Experts can view weather_data') THEN RAISE EXCEPTION 'expert policy missing'; END IF; END \$\$"

      - name: 🔒 Verify tenant isolation and RLS policies
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_cmd() { docker exec -i "$POSTGRES_CONTAINER_ID" psql -U postgres -d agrogrowth -v ON_ERROR_STOP=1 "$@"; }
          psql_cmd -f /tmp/agrogrowth-tests-db/rls-verification.sql
          psql_cmd -f /tmp/agrogrowth-tests-db/admin-user-management-verification.sql
          psql_cmd -f /tmp/agrogrowth-tests-db/effectiveness-reports-verification.sql

  # =====================================
  # DOCKER BUILD (production target)
  # =====================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: agrogrowth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================
  # SECURITY SCAN
  # =====================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🔍 npm audit (report high severity)
        run: npm audit --audit-level=high || true

  # =====================================
  # DEPLOYMENT READINESS GATE
  # =====================================
  deployment-check:
    name: 🚀 Deployment Readiness
    runs-on: ubuntu-latest
    needs: [code-quality, tests, build, ai-services, database-rls, docker-build]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: ✅ All checks passed
        run: echo "🎉 All CI checks passed. Ready for deployment."
