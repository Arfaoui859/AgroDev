name: AgroGrowth Quality Gate

on:
  push:
    branches:
      - feat/soil-analysis-professional-report
  pull_request:
    branches:
      - feat/ai-integration-production-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agrogrowth-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and lint checks
        run: npm run lint

      - name: Unit and integration tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build
